name: release
on:
  workflow_call:
    inputs:
      target-branch:
        type: string
        default: master

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calcular próxima versión (conventional commits)
        id: semver
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      - name: Generar changelog
        run: npx conventional-changelog-cli -p angular -i CHANGELOG.md -s

      - name: Compilar y empaquetar ejecutable nativo 95_Systems.exe
        run: |
          if [ -f "app-shell/Launcher.cs" ]; then
            echo "Compilando frontend e incrustando recursos en 95_Systems.exe..."
            sudo apt-get update -y && sudo apt-get install -y mono-devel zip
            if [ -d "gui-client" ]; then
              cd gui-client && npm install && npm run build && cd ..
            fi
            zip -r bundle.zip server gui-client/dist package.json 2>/dev/null || true
            mcs -target:winexe -r:System.Windows.Forms.dll -r:System.Drawing.dll -r:System.IO.Compression.dll -r:System.IO.Compression.FileSystem.dll -resource:bundle.zip,bundle.zip -out:95_Systems.exe app-shell/Launcher.cs
            zip -j 95_Systems-Windows-Portable.zip 95_Systems.exe
          fi

      - name: Crear GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS=""
          if [ -f "95_Systems.exe" ]; then
            ASSETS="$ASSETS 95_Systems.exe"
          fi
          if [ -f "95_Systems-Windows-Portable.zip" ]; then
            ASSETS="$ASSETS 95_Systems-Windows-Portable.zip"
          fi
          gh release create ${{ steps.semver.outputs.new_tag }} $ASSETS \
            --title "${{ steps.semver.outputs.new_tag }}" \
            --generate-notes
