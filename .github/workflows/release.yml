name: release
on:
  workflow_call:
    inputs:
      target-branch:
        type: string
        default: master

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calcular próxima versión (conventional commits)
        id: semver
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      - name: Generar changelog
        run: npx conventional-changelog-cli -p angular -i CHANGELOG.md -s

      - name: Empaquetar ejecutable nativo si existe app-shell/Launcher.cs
        run: |
          if [ -f "app-shell/Launcher.cs" ]; then
            echo "Compilando cliente y empaquetando 95_Systems..."
            if [ -d "gui-client" ]; then
              cd gui-client && npm install && npm run build && cd ..
            fi
            zip -r 95_Systems-Windows-Portable.zip app-shell server gui-client/dist package.json 2>/dev/null || true
          fi

      - name: Crear GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS=""
          if [ -f "95_Systems-Windows-Portable.zip" ]; then
            ASSETS="95_Systems-Windows-Portable.zip"
          fi
          gh release create ${{ steps.semver.outputs.new_tag }} $ASSETS \
            --title "${{ steps.semver.outputs.new_tag }}" \
            --generate-notes
