name: release
on:
  workflow_call:
    inputs:
      target-branch:
        type: string
        default: master

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Calcular próxima versión (conventional commits)
        id: semver
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      - name: Generar changelog
        run: npx conventional-changelog-cli -p angular -i CHANGELOG.md -s

      - name: Instalar dependencias y compilar proyecto
        run: |
          npm install
          npm run build

      - name: Crear GitHub Release con ejecutable nativo de Escritorio
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ver = "${{ steps.semver.outputs.new_tag }}"
          $assets = @()

          if (Test-Path "dist-desktop") {
            $found = Get-ChildItem "dist-desktop\*.exe" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
            if ($found) { $assets += $found }
          }
          if (Test-Path "dist") {
            $foundDist = Get-ChildItem "dist\*.exe" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
            if ($foundDist) { $assets += $foundDist }
          }
          if (Test-Path "95_Systems.exe") {
            $goExe = "95_Systems-GoServer-$ver.exe"
            Copy-Item "95_Systems.exe" $goExe
            $assets += (Get-Item $goExe).FullName
          }

          if ($assets.Count -gt 0) {
            gh release create $ver $assets --title "$ver" --generate-notes
          } else {
            gh release create $ver --title "$ver" --generate-notes
          }
