name: release
on:
  workflow_call:
    inputs:
      target-branch:
        type: string
        default: master

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calcular próxima versión (conventional commits)
        id: semver
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      - name: Generar changelog
        run: npx conventional-changelog-cli -p angular -i CHANGELOG.md -s

      - name: Compilar binarios Multi-Plataforma (Windows & Linux)
        run: |
          sudo apt-get update -y && sudo apt-get install -y mono-devel zip
          
          # 1. Compilar Frontend React
          if [ -d "gui-client" ]; then
            cd gui-client && npm ci && npm run build && cd ..
          fi

          # 2. Compilar Ejecutables de Windows (Portable & Setup)
          if [ -f "app-shell/Launcher.cs" ]; then
            zip -r bundle.zip server gui-client/dist package.json 2>/dev/null || true
            mcs -target:winexe -r:System.Windows.Forms.dll -r:System.Drawing.dll -r:System.IO.Compression.dll -r:System.IO.Compression.FileSystem.dll -resource:bundle.zip,bundle.zip -out:95_Systems-Windows-Portable.exe app-shell/Launcher.cs
            cp 95_Systems-Windows-Portable.exe 95_Systems-Windows-Setup.exe
          fi

          # 3. Compilar Ejecutable de Linux
          mkdir -p dist-linux
          echo '#!/bin/bash' > dist-linux/95_Systems-Linux-x86_64
          echo 'DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" && pwd )"' >> dist-linux/95_Systems-Linux-x86_64
          echo 'cd "$DIR"' >> dist-linux/95_Systems-Linux-x86_64
          echo 'node server/src/index.js &' >> dist-linux/95_Systems-Linux-x86_64
          echo 'SERVER_PID=$!' >> dist-linux/95_Systems-Linux-x86_64
          echo 'sleep 1' >> dist-linux/95_Systems-Linux-x86_64
          echo 'if command -v xdg-open > /dev/null; then xdg-open http://localhost:4000; fi' >> dist-linux/95_Systems-Linux-x86_64
          echo 'wait $SERVER_PID' >> dist-linux/95_Systems-Linux-x86_64
          chmod +x dist-linux/95_Systems-Linux-x86_64
          cp -r server gui-client/dist package.json dist-linux/ 2>/dev/null || true
          tar -czf 95_Systems-Linux-x86_64.tar.gz -C dist-linux .

      - name: Crear GitHub Release Multi-Plataforma
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.semver.outputs.new_tag }}
        run: |
          ASSETS=""
          if [ -f "95_Systems-Windows-Portable.exe" ]; then ASSETS="$ASSETS 95_Systems-Windows-Portable.exe"; fi
          if [ -f "95_Systems-Windows-Setup.exe" ]; then ASSETS="$ASSETS 95_Systems-Windows-Setup.exe"; fi
          if [ -f "95_Systems-Linux-x86_64.tar.gz" ]; then ASSETS="$ASSETS 95_Systems-Linux-x86_64.tar.gz"; fi
          gh release create "$TAG_NAME" $ASSETS --title "$TAG_NAME" --generate-notes
