name: release
on:
  workflow_call:
    inputs:
      target-branch:
        type: string
        default: master

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Calcular próxima versión (conventional commits)
        id: semver
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      - name: Generar changelog
        run: npx conventional-changelog-cli -p angular -i CHANGELOG.md -s

      - name: Instalar dependencias y compilar proyecto
        run: |
          npm install
          npm run build

      - name: Crear GitHub Release con ejecutable nativo en Go
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ver = "${{ steps.semver.outputs.new_tag }}"
          if (Test-Path "95_Systems.exe") {
            $exeName = "95_Systems-$ver.exe"
            Copy-Item "95_Systems.exe" $exeName
            gh release create $ver $exeName --title "$ver" --generate-notes
          } else {
            $setupExe = Get-Item "dist-desktop/95_Systems Setup *.exe" | Select-Object -ExpandProperty FullName
            $portableExe = Get-Item "dist-desktop/95_Systems *.exe" | Where-Object { $_.FullName -notlike "*Setup*" } | Select-Object -ExpandProperty FullName
            gh release create $ver $setupExe $portableExe --title "$ver" --generate-notes
          }
