name: release
on:
  workflow_call:
    inputs:
      target-branch:
        type: string
        default: master

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calcular próxima versión (conventional commits)
        id: semver
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      - name: Generar changelog
        run: npx conventional-changelog-cli -p angular -i CHANGELOG.md -s

      - name: Compilar binarios Multi-Plataforma (Windows & Linux)
        run: |
          sudo apt-get update -y && sudo apt-get install -y mono-devel zip
          
          # 1. Compilar Frontend React
          if [ -d "gui-client" ]; then
            cd gui-client && npm ci && npm run build && cd ..
          fi

          # 2. Compilar Ejecutables de Windows (Portable & Setup)
          if [ -f "app-shell/Launcher.cs" ]; then
            zip -r bundle.zip server gui-client/dist package.json 2>/dev/null || true
            mcs -target:winexe -r:System.Windows.Forms.dll -r:System.Drawing.dll -r:System.IO.Compression.dll -r:System.IO.Compression.FileSystem.dll -resource:bundle.zip,bundle.zip -out:95_Systems-Windows-Portable.exe app-shell/Launcher.cs
            cp 95_Systems-Windows-Portable.exe 95_Systems-Windows-Setup.exe
          fi

          # 3. Compilar Ejecutable de Linux
          mkdir -p dist-linux
          cat << 'EOF' > dist-linux/95_Systems-Linux-x86_64
#!/bin/bash
DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" && pwd )"
cd "$DIR"
node server/src/index.js &
SERVER_PID=$!
sleep 1
if command -v xdg-open > /dev/null; then
  xdg-open http://localhost:4000
fi
wait $SERVER_PID
EOF
          chmod +x dist-linux/95_Systems-Linux-x86_64
          cp -r server gui-client/dist package.json dist-linux/ 2>/dev/null || true
          tar -czf 95_Systems-Linux-x86_64.tar.gz -C dist-linux .

      - name: Crear GitHub Release Multi-Plataforma
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS=""
          for f in 95_Systems-Windows-Portable.exe 95_Systems-Windows-Setup.exe 95_Systems-Linux-x86_64.tar.gz; do
            if [ -f "$f" ]; then
              ASSETS="$ASSETS $f"
            fi
          done
          gh release create ${{ steps.semver.outputs.new_tag }} $ASSETS \
            --title "${{ steps.semver.outputs.new_tag }}" \
            --generate-notes
