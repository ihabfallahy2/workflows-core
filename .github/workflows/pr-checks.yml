name: pr-checks
on:
  workflow_call:

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Checks Node
        if: hashFiles('package.json') != ''
        run: |
          if [ -f "package-lock.json" ]; then npm ci; else npm install; fi
          npm run lint --if-present
          npm test --if-present

      - name: Checks Java/Maven
        if: hashFiles('pom.xml') != ''
        run: mvn -B verify

      - name: Checks Python
        if: hashFiles('requirements.txt') != ''
        run: |
          pip install -r requirements.txt
          pytest || true

  lint-commits:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

